# SwiftLint. Style is SwiftFormat's job, so the rules here are about correctness and hygiene.
# Runs on every agent edit (with --fix) via .claude/hooks/format-swift.sh and strictly on CI.

included:
  - App
  - Packages
excluded:
  - "**/.build"
  - "**/__Snapshots__"

# Rules SwiftFormat already owns. Keeping them here would only produce duplicate noise.
disabled_rules:
  - trailing_whitespace
  - vertical_whitespace
  - opening_brace
  - closing_brace
  - trailing_comma
  - comma
  - colon
  - function_name_whitespace
  - return_arrow_whitespace
  - statement_position
  - switch_case_alignment
  - void_return
  - unused_optional_binding

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - fatal_error_message
  - unowned_variable_capture
  - discouraged_optional_boolean
  - empty_count
  - empty_string
  - first_where
  - last_where
  - contains_over_first_not_nil
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - sorted_first_last
  - toggle_bool
  - redundant_nil_coalescing
  - redundant_type_annotation
  - unneeded_parentheses_in_closure_argument
  - closure_spacing
  - multiline_arguments
  - multiline_parameters
  - private_action
  - private_outlet
  - prohibited_super_call
  - overridden_super_call
  - identical_operands
  - yoda_condition
  - lower_acl_than_parent
  - legacy_multiple
  - prefer_self_in_static_references
  - static_operator
  - test_case_accessibility
  - unavailable_function
  - weak_delegate
  - period_spacing

analyzer_rules:
  - unused_declaration
  - unused_import

line_length:
  warning: 100
  error: 140
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: false

identifier_name:
  min_length: 2
  excluded: [id, x, y, z, i, j, dx, dy, to, at]

type_name:
  max_length: 50

nesting:
  type_level: 2

function_body_length:
  warning: 60
  error: 100

file_length:
  warning: 400
  error: 600

cyclomatic_complexity:
  warning: 12
  error: 20

force_cast: error
force_try: error
force_unwrapping: error
