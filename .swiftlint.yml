# SwiftLint. Style is SwiftFormat's job, so the rules here are about correctness, hygiene, and
# the architecture rules from CLAUDE.md that a regex can enforce. Scope is declared here only.
# Runs on every agent edit (with --fix) via .claude/hooks/on-edit.sh and strictly on CI.

included:
  - App
  - Packages
excluded:
  - "**/.build"
  - "**/__Snapshots__"

# Rules SwiftFormat already owns. Keeping them here would only produce duplicate noise.
disabled_rules:
  - trailing_whitespace
  - vertical_whitespace
  - opening_brace
  - closing_brace
  - trailing_comma
  - comma
  - colon
  - function_name_whitespace
  - return_arrow_whitespace
  - statement_position
  - switch_case_alignment
  - void_return

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - fatal_error_message
  - unowned_variable_capture
  - discouraged_optional_boolean
  - empty_count
  - empty_string
  - first_where
  - last_where
  - contains_over_first_not_nil
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - sorted_first_last
  - toggle_bool
  - redundant_nil_coalescing
  - redundant_type_annotation
  - unneeded_parentheses_in_closure_argument
  - closure_spacing
  - multiline_arguments
  - multiline_parameters
  - identical_operands
  - yoda_condition
  - lower_acl_than_parent
  - legacy_multiple
  - prefer_self_in_static_references
  - static_operator
  - unavailable_function
  - period_spacing

analyzer_rules:
  - unused_declaration
  - unused_import

line_length:
  warning: 100
  error: 140
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length: 2
  excluded: [id, x, y, z, i, j, dx, dy, to, at]

type_name:
  max_length: 50

nesting:
  type_level: 2

function_body_length:
  warning: 60
  error: 100

file_length:
  warning: 400
  error: 600

cyclomatic_complexity:
  warning: 12
  error: 20

force_unwrapping: error

# Architecture rules from CLAUDE.md that are pure pattern matches. The compiler enforces the
# dependency graph between targets; these catch the imports and idioms it cannot.
custom_rules:
  observable_object:
    name: "ObservableObject"
    regex: '(\bObservableObject\b|@Published\b|@StateObject\b|@EnvironmentObject\b)'
    message: "State is @Observable; see .claude/rules/swift.md"
    severity: error
  workout_core_imports:
    name: "WorkoutCore imports"
    included: "Packages/Sources/WorkoutCore/.*"
    regex: '^import (SwiftUI|SwiftData|UIKit|Combine)\b'
    message: "WorkoutCore imports only Foundation"
    severity: error
  workout_store_imports:
    name: "WorkoutStore imports"
    included: "Packages/Sources/WorkoutStore/.*"
    regex: '^import (SwiftUI|UIKit)\b'
    message: "WorkoutStore has no UI dependencies"
    severity: error
  design_system_imports:
    name: "DesignSystem imports"
    included: "Packages/Sources/DesignSystem/.*"
    regex: '^import (WorkoutCore|WorkoutStore|Features)\b'
    message: "DesignSystem never imports domain code; components take strings and numbers"
    severity: error
  fixed_font_size:
    name: "Fixed font size"
    included: "(Packages/Sources/Features|App)/.*"
    regex: '\.font\(\.system\(size:'
    message: "Use a Font.pp* token so Dynamic Type works"
    severity: error
  literal_color:
    name: "Literal color"
    included: "(Packages/Sources/Features|App)/.*"
    regex: 'Color\((red|hue|white|uiColor|\.sRGB|#)'
    message: "Use a Color.pp* token from DesignSystem"
    severity: error
