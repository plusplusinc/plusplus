name: TestFlight

# Manual by default. Tagging v* ships too, so a release is one `git tag` away.
on:
  workflow_dispatch:
    inputs:
      release-notes:
        description: "What testers should know about this build"
        required: false
        default: "Internal build."
  push:
    tags: ["v*"]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  deploy:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Fails immediately with a readable message instead of dying deep inside xcodebuild with
      # an opaque signing error.
      - name: Check required secrets
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
          CERTIFICATES_P12_PASSWORD: ${{ secrets.CERTIFICATES_P12_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          missing=""
          for name in APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY \
                      CERTIFICATES_P12 CERTIFICATES_P12_PASSWORD DEVELOPMENT_TEAM; do
            eval "value=\${$name}"
            [ -z "$value" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "See docs/testflight.md for how to create each one."
            exit 1
          fi

      - uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_P12 }}
          p12-password: ${{ secrets.CERTIFICATES_P12_PASSWORD }}

      - name: Stage App Store Connect API key
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "${{ secrets.APPSTORE_PRIVATE_KEY }}" \
            > "$HOME/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8"

      # -allowProvisioningUpdates plus the API key lets Xcode create and download whatever
      # profiles the app (and later the Watch app and widget) needs, so no profile is ever
      # stored as a secret.
      - name: Archive
        run: |
          xcodebuild archive \
            -project PlusPlus.xcodeproj \
            -scheme PlusPlus \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PlusPlus.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.DEVELOPMENT_TEAM }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      # Written here rather than committed so the team ID stays out of the repo.
      - name: Write export options
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.DEVELOPMENT_TEAM }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/PlusPlus.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}"

      - uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: build/export/PlusPlus.ipa
          app-type: ios
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          release-notes: ${{ inputs.release-notes || 'Tagged release.' }}
          uses-non-exempt-encryption: "false"

      - name: Upload dSYMs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dsyms
          path: build/PlusPlus.xcarchive/dSYMs
          retention-days: 30
          if-no-files-found: ignore
