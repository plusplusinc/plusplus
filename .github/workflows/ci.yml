# CI on GitHub's macOS runners — the substitute for local Simulator
# validation when development happens in remote (Linux) Claude sessions.
# The repo is public, so Actions minutes are free; the old paths-ignore
# for docs-only pushes is gone because main's ruleset REQUIRES these
# checks — a push that skips CI leaves its PR permanently unmergeable.
name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
  # Fork PRs get zero checks from push triggers, which leaves them
  # permanently unmergeable under the ruleset (#160). Same-repo PRs skip
  # the pull_request runs (their push runs already carry the checks).
  pull_request:
  workflow_dispatch:

# A superseded push on the same branch cancels the older run; runs on main
# are never cancelled so every merge keeps its artifacts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # Same-repo PRs already ran on push; only fork PRs need this event.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "No Xcode 26 found; available:" && ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available --json | python3 -c "
          import sys, json
          devices = json.load(sys.stdin)['devices']
          iphones = [d['name'] for runtime, devs in devices.items()
                     if 'iOS' in runtime for d in devs
                     if d['name'].startswith('iPhone')]
          print(sorted(iphones)[-1])
          ")
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project PlusPlus.xcodeproj \
            -scheme PlusPlus \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

      # Job logs and artifacts live on Azure blob storage, which the remote
      # agent sandbox can't reach; annotations ride the Checks API and are
      # readable from anywhere. Surface the failure lines there.
      - name: Surface failures as annotations
        if: failure()
        run: |
          [ -f xcodebuild.log ] || exit 0
          grep -E "Test Case '.*' failed|✘ Test|recorded an issue|Fatal error|TEST FAILED|Restarting after unexpected exit|error:|corrupted|freshContext:" xcodebuild.log \
            | sort -u | head -12 | while IFS= read -r line; do
            echo "::error title=CI failure detail::$(echo "$line" | tr -d '\r' | cut -c1-400)"
          done
          exit 0

  # PlusPlusKit is platform-pure by design (docs/PLATFORM.md); its tests run
  # on Linux at 1x minutes, and this job failing means someone leaked an
  # Apple-only dependency into the shared core.
  kit-test:
    # Same-repo PRs already ran on push; only fork PRs need this event.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    container: swift:latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # CLAUDE.md is budgeted in BYTES and LINE LENGTH, not lines (2026-07-28).
      # It once reached 371 KB in 157 lines — 310 KB of it in a single line, which
      # passed the old "under ~200 lines" rule and made every concurrent branch
      # conflict, since git merges line by line and each PR rewrote that one line.
      # Cheap enough to ride an existing required job rather than add one.
      - name: Agent-doc size budget
        shell: bash
        run: |
          max_bytes=25600        # 25 KB — CLAUDE.md only (it loads every session)
          max_rule_bytes=24576   # 24 KB per rules file (added 2026-07-31: app-surfaces.md
                                 # hit 48 KB and loaded on every app-code task; split it
                                 # by path scope when this cap binds, don't raise it)
          max_line=2048          # ~2 KB any single line, in every agent doc
          fail=0

          bytes=$(wc -c < CLAUDE.md)
          if [ "$bytes" -gt "$max_bytes" ]; then
            echo "::error title=CLAUDE.md too large::${bytes} bytes exceeds the ${max_bytes}-byte budget. Move detail to docs/DECISIONS.md (dated entry) or .claude/rules/ (path-scoped)."
            fail=1
          fi
          echo "CLAUDE.md: ${bytes} bytes (budget ${max_bytes})"

          for f in .claude/rules/*.md; do
            [ -f "$f" ] || continue
            rbytes=$(wc -c < "$f")
            if [ "$rbytes" -gt "$max_rule_bytes" ]; then
              echo "::error title=${f} too large::${rbytes} bytes exceeds the ${max_rule_bytes}-byte per-rules-file budget. Split by path scope (narrower paths: frontmatter), or move history to docs/DECISIONS.md — rules hold current laws, not changelogs."
              fail=1
            fi
            echo "  ${f}: ${rbytes} bytes (budget ${max_rule_bytes})"
          done

          # Line length applies to the RULES files too — app-surfaces.md grew an
          # 8.7 KB paragraph the same way, and it had drifted into stating things
          # that were no longer true (2026-07-28). DECISIONS.md is deliberately
          # EXEMPT from every budget — append-only, and its long entries are the
          # record, not drift.
          for f in CLAUDE.md .claude/rules/*.md; do
            [ -f "$f" ] || continue
            longest=$(awk '{ if (length($0) > m) { m = length($0); n = NR } } END { print m ":" n }' "$f")
            len=${longest%%:*}
            line=${longest##*:}
            if [ "${len:-0}" -gt "$max_line" ]; then
              echo "::error title=Line too long in ${f}::Line ${line} is ${len} chars (max ${max_line}). Add a NEW line instead of growing an existing one — one item per line is what keeps concurrent branches mergeable, and it is what stops a paragraph quietly going stale."
              fail=1
            fi
            echo "  ${f}: longest line ${len} chars (line ${line})"
          done
          exit $fail
      - name: Run PlusPlusKit tests
        # Explicit bash: the swift container's default step shell can be
        # dash, where `set -o pipefail` itself exits 2 before swift runs.
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path PlusPlusKit 2>&1 | tee kit-test.log
      - name: Surface failures as annotations
        if: failure()
        shell: bash
        run: |
          [ -f kit-test.log ] || exit 0
          grep -E "✘|error:|Fatal error" kit-test.log | sort -u | head -10 | while IFS= read -r line; do
            echo "::error title=kit-test failure::$(echo "$line" | tr -d '\r' | cut -c1-400)"
          done
          exit 0

  # The plusplus CLI builds and tests on Linux (issue #24); same 1x-minute
  # economics as kit-test.
  cli-test:
    # Same-repo PRs already ran on push; only fork PRs need this event.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    container: swift:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run CLI tests
        # Explicit bash — see kit-test.
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path PlusPlusCLI 2>&1 | tee cli-test.log
      - name: Build release binary
        run: swift build -c release --package-path PlusPlusCLI
      - name: Surface failures as annotations
        if: failure()
        shell: bash
        run: |
          [ -f cli-test.log ] || exit 0
          grep -E "✘|error:|Fatal error" cli-test.log | sort -u | head -10 | while IFS= read -r line; do
            echo "::error title=cli-test failure::$(echo "$line" | tr -d '\r' | cut -c1-400)"
          done
          exit 0

  # UI smoke tests + screenshots. Slower and more minute-hungry than the
  # unit job, so gated to manual dispatch and pushes to main.
  ui-test:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    # For the tracking issue below. Scoped to this job, so nothing else in
    # the workflow gains write access.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "No Xcode 26 found; available:" && ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available --json | python3 -c "
          import sys, json
          devices = json.load(sys.stdin)['devices']
          iphones = [d['name'] for runtime, devs in devices.items()
                     if 'iOS' in runtime for d in devs
                     if d['name'].startswith('iPhone')]
          print(sorted(iphones)[-1])
          ")
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Run UI smoke tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project PlusPlus.xcodeproj \
            -scheme PlusPlusUI \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -resultBundlePath UITestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ui-xcodebuild.log

      - name: Export screenshots
        if: always()
        run: |
          if [ -d UITestResults.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path UITestResults.xcresult \
              --output-path screenshots || echo "attachment export failed"
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Upload UI test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-xcodebuild-log
          path: ui-xcodebuild.log
          if-no-files-found: ignore

      # Same rationale as the unit job: the sandbox can't reach job
      # logs or artifacts, so the failing test names must ride the
      # Checks API. This job lacked it and its first real failure
      # (2026-07-08) was undiagnosable remotely.
      - name: Surface failures as annotations
        if: failure()
        run: |
          [ -f ui-xcodebuild.log ] || exit 0
          grep -E "Test Case '.*' failed|Assertion Failure|recorded an issue|Fatal error|TEST FAILED|Restarting after unexpected exit|error:" ui-xcodebuild.log \
            | sort -u | head -12 | while IFS= read -r line; do
            echo "::error title=ui-test failure detail::$(echo "$line" | tr -d '\r' | cut -c1-400)"
          done
          exit 0

      # ui-test is NOT a required check, and a non-required check can sit red
      # indefinitely with nobody finding out: it failed on every push to main
      # from 2026-07-24 to 2026-07-30 — 22 of them — while the three required
      # checks went green and merged each one, and two TestFlight builds
      # shipped in that state (#483). Making it required is the wrong trade:
      # it is the slowest job and has two documented flake modes, so a bad
      # runner would block every merge. Instead a red main opens ONE tracking
      # issue and then stays quiet until that issue is closed, which turns a
      # silent red into something that reaches the backlog exactly once.
      - name: File a tracking issue when main's smoke suite is red
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="ui-test is red on main"
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "Already tracked in #$EXISTING; staying quiet."
            exit 0
          fi
          FAILING=$(grep -oE "SmokeTests.swift:[0-9]+: error: -\[[^]]+\]" ui-xcodebuild.log 2>/dev/null | sort -u | head -8 || true)
          gh issue create --title "$TITLE" --body "$(printf '%s\n' \
            "The UI smoke suite failed on a push to \`main\` (\`${GITHUB_SHA}\`)." \
            "" \
            "It is not a required check, so the merge went through on the three that are." \
            "" \
            "Failing:" \
            '```' \
            "${FAILING:-see the run}" \
            '```' \
            "" \
            "Run: ${RUN_URL}" \
            "" \
            "The \`ui-screenshots\` artifact on that run shows what the app actually rendered at each step." \
            "" \
            "This issue is filed once and not repeated: while it is open, later red runs stay quiet. Close it when the suite is green." \
            "" \
            "---" \
            "_Generated by [Claude Code](https://claude.ai/code)_")" \
            || echo "::warning title=tracking issue::could not file one (needs issues: write)"
